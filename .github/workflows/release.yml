name: Build and Release

on:
  # 打 tag（v*）时自动触发
  push:
    tags:
      - 'v*'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.2.0）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # 发布门禁：tag 触发时先跑完整检查，verify 失败不构建、不发布。
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build
        run: pnpm build

      - name: i18n key check
        run: node scripts/check-i18n.mjs

      - name: Command contract check
        run: pnpm check:commands

      - name: Rust fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          cargo test --manifest-path src-tauri/Cargo.toml --test contracts
          cargo test --manifest-path src-tauri/Cargo.toml --test staged_failures

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: E2E
        run: pnpm test:e2e

  # ── Windows 单 exe + 插件 tgz ──
  # Linux 明确不打包、不发布；Linux 只保留 ci.yml 的编译/测试。
  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Windows：单 exe（便携）──
      - name: Build (Windows)
        run: pnpm tauri build --no-bundle

      - name: Rename artifact
        run: Copy-Item "src-tauri\target\release\dsh-multiver.exe" "dsh-multiver.exe"

      # ── 打包 dsh 插件 ──
      # 插件是纯 JS + JSON，与平台无关；用 pnpm pack 保证 tarball 内容与 npm 通道一致
      - name: Pack dsh plugin
        working-directory: dsh-plugin
        run: |
          pnpm pack
          Get-ChildItem *.tgz | ForEach-Object { "打包产物：$($_.Name) / $($_.Length) 字节" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-multiver-windows
          path: |
            dsh-multiver.exe
            dsh-plugin/*.tgz

  # ── npm 发布：OIDC trusted publishing（默认关闭）──
  #
  # 启用步骤：
  #   1. npmjs.com → 包 dsh-multiver-bridge → Settings → Trusted Publisher
  #      绑定 GitHub 用户/组织 K1-lihongrong、仓库 dsh-multiver、workflow release.yml
  #   2. gh variable set NPM_PUBLISH_ENABLED --body true
  #   3. 下一个 v* tag 自动发布；npm 上已有同版本则跳过
  #
  # 变量未设置或不为 true 时本 job 不运行，Release 流程与现在完全一致。
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-multiver-windows
          path: release-assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC
        run: npm install -g npm@11

      - name: Publish plugin (skip if version exists)
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./dsh-plugin/package.json').version")
          TGZ=$(find release-assets -name "dsh-multiver-bridge-${VERSION}.tgz" -print -quit)
          if [ -z "$TGZ" ]; then
            echo "找不到 dsh-multiver-bridge-${VERSION}.tgz" >&2
            find release-assets -type f >&2
            exit 1
          fi
          if npm view "dsh-multiver-bridge@${VERSION}" version >/dev/null 2>&1; then
            echo "dsh-multiver-bridge@${VERSION} 已发布，跳过"
            exit 0
          fi
          npm publish "$TGZ" --access public --provenance

  # ── 发布：Windows 构建完成后创建 Release ──
  release:
    needs: [build, publish-npm]
    # publish-npm 默认关闭（变量未设置 → skipped），Release 仍照常运行；
    # 变量开启后，npm 发布失败会阻断 Release，保证两条通道同成败。
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.publish-npm.result == 'success' || needs.publish-npm.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-multiver-windows
          path: release-assets

      - name: List artifacts
        run: find release-assets -type f

      # 生成 SHA256SUMS.txt：插件部署引导用它校验下载的 exe
      - name: Generate SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          {
            if [ -f dsh-multiver.exe ]; then
              sha256sum dsh-multiver.exe
            fi
            # 插件 tarball：插件部署引导与用户手工校验都靠它
            while IFS= read -r -d '' f; do
              (cd "$(dirname "$f")" && sha256sum "$(basename "$f")")
            done < <(find . -type f -name '*.tgz' -print0)
          } > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH 版本管理器 ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            release-assets/dsh-multiver.exe
            release-assets/*.tgz
            release-assets/SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          draft: false
          allowUpdates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
