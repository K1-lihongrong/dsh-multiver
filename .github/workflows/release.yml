name: Build and Release

on:
  # 打 tag（modpack-v*）时自动触发（与主干 v* 区分）
  push:
    tags:
      - 'modpack-v*'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 modpack-v0.1.5）'
        required: true
        type: string

# 发布需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --no-bundle

      - name: Rename artifact
        run: |
          Copy-Item "src-tauri\target\release\dsh-modpack.exe" "dsh-modpack.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-modpack-exe
          path: dsh-modpack.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH 整合包管理器 ${{ github.event.inputs.tag || github.ref_name }}
          files: dsh-modpack.exe
          generate_release_notes: false
          draft: false
          body: |
            ## DSH 整合包管理器 v0.1.5

            > ⚠️ **这是「整合包分支」的发布**（`feat/dspack-integration`），**不是主干**。
            > 它与主干「DSH 版本管理器」是**平行的两个产品**，互不替代。

            ## 与主干的区别

            | | 主干 DSH 版本管理器 | 本分支 DSH 整合包管理器 |
            | :--- | :--- | :--- |
            | exe | `dsh-multiver.exe` | `dsh-modpack.exe` |
            | 目标 | 管理 dsh **版本**（安装/切换/隔离） | 管理 dsh **整合包**（.dspack 导入/导出/市场） |
            | 数据根布局 | 只认 `versions/` | 整合包实例放 `modpacks/`，与主干共用数据根时互不干扰 |
            | 版本线 | v0.1.x | modpack-v0.1.x（独立） |

            ## 本分支特色功能

            - **整合包导入**：拖入/选择 `.dspack`，四阶段导入 + 失败全量回滚
            - **整合包市场**：消费 `index.json`，列表 + 搜索/分类 + 一键下载安装
            - **导出整合包**：把实例打回 `.dspack`（CLI `--export` + GUI 按钮）
            - **无头 CLI 导入**：`--import <路径> --yes`（退出码 0/1，可脚本化）
            - **复用本机 dsh 版本**：纯技能包秒装（junction）
            - **整合包导入进度条**：dsh 本体/依赖安装阶段百分比 + 动态数字

            ## 同时具备（与主干共享）

            - 安装进度条、卸载状态反馈、失败换源重试、环境检查引导
            - 多版本共存、省磁盘（pnpm store 硬链接）、内嵌窗口、桌面快捷方式、数据隔离
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


