name: Build and Release

on:
  # 打 tag（v*）时自动触发
  push:
    tags:
      - 'v*'
  # 允许手动触发
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（如 v0.1.4）'
        required: true
        type: string

# 发布需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri build --no-bundle

      - name: Rename artifact
        run: |
          Copy-Item "src-tauri\target\release\dsh-multiver.exe" "dsh-multiver.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-multiver-exe
          path: dsh-multiver.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: DSH 版本管理器 ${{ github.event.inputs.tag || github.ref_name }}
          files: dsh-multiver.exe
          generate_release_notes: false
          draft: false
          body: |
            ## DSH 版本管理器 v0.1.4

            ### 🐛 重要修复

            - **修复确认对话框失效**：Tauri WebView2 中 window.confirm 静默失效，导致「卸载」「清理隔离数据」「复制共享数据」「运行非隔离版本」等所有需确认的操作**点了没反应**。现已改用系统原生对话框。

            ### ✨ 新增

            - **根除孤儿进程**：用 Windows Job Object 绑定 dsh 子进程，管理器进程退出（正常/被强杀/崩溃）时由系统**自动清理**所有 dsh 进程，不再残留占资源、锁文件。
            - **共享 home 提示**：非隔离版本在列表中显示「共享 home」标记；运行前弹提示（多版本混用可能导致插件/依赖错配，建议对测试版开隔离），可在「路径设置」中关闭。

            ### 🎨 体验

            - **消除误导性终端黑框**：创建快捷方式、环境检查、刷新版本列表、安装版本时不再弹出终端窗口（仅「浏览器打开」保留终端，以便查看 URL/token）。

            ### 🔧 其它

            - 修复 lib.rs 中多余的 use tauri::Manager 警告
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
