<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F2F7"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F6EF7"/>
      <stop offset="100%" stop-color="#3D5BEE"/>
    </linearGradient>
  </defs>

  <!-- 圆角白底 -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bg)"/>

  <!-- 三个层叠的版本方块（象征多版本堆叠管理）：
       后两个用半透明彩色，最前的用主色实心并带层级标记 -->
  <g>
    <!-- 底层（黄） -->
    <rect x="150" y="266" width="150" height="150" rx="34" fill="#F5C542" opacity="0.55"/>
    <!-- 中层（红） -->
    <rect x="196" y="220" width="150" height="150" rx="34" fill="#E5484D" opacity="0.55"/>
    <!-- 顶层（主蓝，实心） -->
    <rect x="242" y="174" width="150" height="150" rx="34" fill="url(#tile)"/>

    <!-- 顶层内：三条"版本行"短线，暗示版本列表 -->
    <g fill="#FFFFFF" opacity="0.95">
      <rect x="270" y="214" width="94" height="12" rx="6"/>
      <rect x="270" y="240" width="70" height="12" rx="6"/>
      <rect x="270" y="266" width="82" height="12" rx="6"/>
    </g>
  </g>

  <!-- 左下角向上箭头：象征"升级/选择版本" -->
  <g transform="translate(150,150)">
    <path d="M0 70 L34 30 L68 70 L48 70 L48 118 L20 118 L20 70 Z"
          fill="#30A46C" opacity="0.9"/>
  </g>
</svg>
